<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Pelada</title>
<style>
:root{--g:#0f7a46;--bg:#f3f6f5;--card:#fff;--txt:#17211c;--muted:#66736c;--line:#dfe7e2;--red:#c83d3d;--blue:#2364aa;--amber:#f0a128}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--txt)}button,input,select{font:inherit}
.shell{max-width:980px;margin:auto;padding-bottom:78px;min-height:100vh}.top{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:900}.sub{font-size:12px;opacity:.85}main{padding:14px}.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}@media(max-width:680px){.g2,.g3{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 6px 20px #102d2210}.big{font-size:28px;font-weight:900}.muted{color:var(--muted)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spread{display:flex;justify-content:space-between;gap:10px;align-items:center}.stack{display:flex;flex-direction:column;gap:9px}.btn{border:0;border-radius:12px;padding:11px 13px;font-weight:800;background:#e9efec}.btn.primary{background:var(--g);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.amber{background:var(--amber);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line)}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:800;color:var(--muted)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:30}.navin{max-width:980px;margin:auto;display:grid;grid-template-columns:repeat(7,1fr)}.nav button{border:0;background:transparent;padding:9px 2px;font-size:10px}.nav button.active{background:#e8f4ed;color:var(--g);font-weight:900}
.item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px}.list{display:flex;flex-direction:column;gap:8px}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#edf6f1;font-size:12px;font-weight:800}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(150deg,#0d7040,#102d22)}.login .card{width:min(430px,100%);padding:22px}.logo{width:56px;height:56px;border-radius:17px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:28px}
.score{background:#0d261b;color:#fff;border-radius:22px;padding:15px}.clock{font-size:38px;font-weight:950;text-align:center}.scoreline{font-size:46px;font-weight:950;text-align:center}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team{background:#ffffff12;border-radius:15px;padding:11px}.player{padding:6px 0;border-bottom:1px solid #ffffff16}.gk{color:#ffd772;font-weight:900}.gameBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.judgeTools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px;position:sticky;bottom:10px;z-index:50;background:#0d261b;padding:8px;border-radius:14px}.judgeTools .btn{min-height:50px}.judgeTools .undoBig{background:var(--red);color:#fff;font-weight:950}
.modalBack{position:fixed;inset:0;background:#0008;z-index:80;display:grid;place-items:end center}.modal{width:min(620px,100%);background:#fff;border-radius:22px 22px 0 0;padding:18px;max-height:88vh;overflow:auto}.choice{display:flex;flex-direction:column;gap:8px}.choice button{padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;text-align:left}.empty{text-align:center;padding:24px;color:var(--muted)}
</style>
</head>
<body><div id="app"></div><div id="modal"></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL='https://jgbsvlkcuklbciyyrmxq.supabase.co', KEY='sb_publishable_8vHIDcnFjHNk6LjhdEQtXA_zeeoTFFJ';
const sb=createClient(URL,KEY), $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n||0));
const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isoToday=()=>new Date().toISOString().slice(0,10), tsec=s=>{s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
let S={user:null,settings:null,session:null,players:[],sp:[],payments:[],cash:[],matches:[],active:null,mp:[],events:[],pens:[],prevMatch:null,prevMp:[],tab:'today',timer:null};
const judgeToken=new URLSearchParams(location.search).get('judge');
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});

if(judgeToken){bootJudge(judgeToken)}else{boot()}

async function boot(){
 const {data:{session}}=await sb.auth.getSession();S.user=session?.user||null;
 sb.auth.onAuthStateChange((_e,s)=>{S.user=s?.user||null;if(!S.user)login()});
 if(S.user)await load();else login();
}
function login(){
 $('#app').innerHTML=`<div class="login"><div class="card"><div class="logo">⚽</div><h1>Pelada</h1><p class="muted">Gestão completa da pelada.</p><div class="stack"><div class="field"><label>Login</label><input id="login" value="khayrolessa" autocomplete="username"></div><div class="field"><label>Senha</label><input id="pass" type="password" autocomplete="current-password"></div><button id="in" class="btn primary">Entrar</button><button id="setup" class="btn ghost">Primeiro acesso / ativar administrador</button><div id="msg" class="muted"></div></div></div></div>`;
 $('#in').onclick=async()=>{
   const login=$('#login').value.trim(),password=$('#pass').value;
   if(!login||!password)return $('#msg').textContent='Informe login e senha.';
   if(login.includes('@')){
     const{error}=await sb.auth.signInWithPassword({email:login,password});if(error)return $('#msg').textContent=error.message;
   }else{
     let r=await fetch(URL+'/functions/v1/username-login',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({username:login,password})}),j=await r.json();
     if(!r.ok)return $('#msg').textContent=j.error||'Falha no login.';
     const{error}=await sb.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});if(error)return $('#msg').textContent=error.message;
   }
   await load();
 };
 $('#setup').onclick=async()=>{
   const password=$('#pass').value;if(password.length<6)return $('#msg').textContent='Defina uma senha com pelo menos 6 caracteres.';
   const email=prompt('Informe seu e-mail apenas para ativar a conta do administrador:');if(!email)return;
   const{data,error}=await sb.auth.signUp({email:email.trim(),password,options:{data:{username:'khayrolessa'},emailRedirectTo:location.origin}});
   if(error)return $('#msg').textContent=error.message;
   $('#msg').textContent=data.session?'Administrador ativado.':'Confira seu e-mail, confirme a conta e depois entre uma vez com esse e-mail. Após isso, use khayrolessa.';
 };
}
async function load(){
 let uid=S.user.id,{data:set}=await sb.from('app_settings').select('*').eq('owner_id',uid).maybeSingle();S.settings=set;
 const {data:profile}=await sb.from('profiles').select('username').eq('id',uid).maybeSingle();
 if(profile?.username&&S.user.email)await sb.from('login_aliases').upsert({owner_id:uid,username:profile.username,email:S.user.email},{onConflict:'owner_id'});
 let {data:s}=await sb.from('sessions').select('*').eq('owner_id',uid).eq('session_date',isoToday()).maybeSingle();
 if(!s){let r=await sb.from('sessions').insert({owner_id:uid,session_date:isoToday()}).select().single();s=r.data}S.session=s;
 await refresh(false);shell();
 sb.channel('pelada').on('postgres_changes',{event:'*',schema:'public'},()=>refresh()).subscribe();
}
async function refresh(draw=true){
 let sid=S.session.id;let [p,sp,pay,cash,mt]=await Promise.all([
 sb.from('players').select('*').eq('owner_id',S.user.id).eq('active',true).order('name'),
 sb.from('session_players').select('*,players(*)').eq('session_id',sid).order('arrived_at'),
 sb.from('payments').select('*').eq('session_id',sid),
 sb.from('cash_entries').select('*').eq('owner_id',S.user.id).order('occurred_at',{ascending:false}),
 sb.from('matches').select('*').eq('session_id',sid).order('sequence_no',{ascending:false})]);
 S.players=p.data||[];S.sp=sp.data||[];S.payments=pay.data||[];S.cash=cash.data||[];S.matches=mt.data||[];S.active=S.matches.find(m=>['scheduled','live','paused'].includes(m.status))||null;
 if(S.active){let[a,b,cq]=await Promise.all([
 sb.from('match_players').select('*,players(*)').eq('match_id',S.active.id),
 sb.from('match_events').select('*').eq('match_id',S.active.id).order('occurred_at'),
 sb.from('penalties').select('*').eq('match_id',S.active.id).eq('voided',false).order('sequence_no')]);S.mp=a.data||[];S.events=b.data||[];S.pens=cq.data||[];
 S.prevMatch=S.matches.filter(x=>x.status==='finished'&&x.sequence_no<S.active.sequence_no).sort((x,y)=>y.sequence_no-x.sequence_no)[0]||null;
 if(S.prevMatch){let{data:pm}=await sb.from('match_players').select('*,players(*)').eq('match_id',S.prevMatch.id);S.prevMp=pm||[]}else S.prevMp=[];
 }else{S.mp=[];S.events=[];S.pens=[];S.prevMatch=null;S.prevMp=[]}
 if(draw)render();
}
function confirmAction(title,message,okLabel='OK'){
 return new Promise(resolve=>{
  const old=document.getElementById('actionConfirmOverlay');if(old)old.remove();
  const wrap=document.createElement('div');wrap.id='actionConfirmOverlay';wrap.className='modalBack';
  wrap.innerHTML=`<div class="modal"><h3>${esc(title)}</h3><p class="muted">${esc(message)}</p><div class="row" style="justify-content:flex-end;margin-top:14px"><button id="cancelAction" class="btn ghost">Cancelar</button><button id="confirmActionBtn" class="btn primary">${esc(okLabel)}</button></div></div>`;
  document.body.appendChild(wrap);
  const done=v=>{wrap.remove();resolve(v)};
  wrap.querySelector('#cancelAction').onclick=()=>done(false);
  wrap.querySelector('#confirmActionBtn').onclick=()=>done(true);
 });
}
function choosePlayerAction(title,players,message='Selecione um jogador'){
 return new Promise(resolve=>{
  const old=document.getElementById('playerChoiceOverlay');if(old)old.remove();
  const wrap=document.createElement('div');wrap.id='playerChoiceOverlay';wrap.className='modalBack';
  wrap.innerHTML=`<div class="modal"><h3>${esc(title)}</h3><p class="muted">${esc(message)}</p><div class="choice">${players.map(p=>`<button data-choice="${p.player_id||p.id}">${esc(p.players?.name||p.name||'Jogador')}</button>`).join('')}</div><button id="cancelChoice" class="btn ghost" style="margin-top:10px;width:100%">Cancelar</button></div>`;
  document.body.appendChild(wrap);
  const done=v=>{wrap.remove();resolve(v)};
  wrap.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>done(b.dataset.choice));
  wrap.querySelector('#cancelChoice').onclick=()=>done(null);
 });
}
function chooseSideAction(title,leftPlayers,rightPlayers,message='Selecione o time'){
 return new Promise(resolve=>{
  const old=document.getElementById('sideChoiceOverlay');if(old)old.remove();
  const wrap=document.createElement('div');wrap.id='sideChoiceOverlay';wrap.className='modalBack';
  const roster=arr=>arr.map(p=>esc(p.players?.name||p.name||'Jogador')).join(' · ')||'Sem jogadores';
  wrap.innerHTML=`<div class="modal"><h3>${esc(title)}</h3><p class="muted">${esc(message)}</p><div class="grid g2"><button class="item" data-side-choice="left" style="text-align:left;min-height:130px;border:2px solid #dfe7e2"><div style="font-size:20px;font-weight:950">⬅️ TIME ESQUERDO</div><div class="muted" style="margin-top:8px">${roster(leftPlayers)}</div></button><button class="item" data-side-choice="right" style="text-align:right;min-height:130px;border:2px solid #dfe7e2"><div style="font-size:20px;font-weight:950">TIME DIREITO ➡️</div><div class="muted" style="margin-top:8px">${roster(rightPlayers)}</div></button></div><button id="cancelSideChoice" class="btn ghost" style="margin-top:12px;width:100%">Cancelar</button></div>`;
  document.body.appendChild(wrap);
  const done=v=>{wrap.remove();resolve(v)};
  wrap.querySelectorAll('[data-side-choice]').forEach(b=>b.onclick=()=>done(b.dataset.sideChoice));
  wrap.querySelector('#cancelSideChoice').onclick=()=>done(null);
 });
}
function shell(){
 $('#app').innerHTML=`<div class="shell"><header class="top"><div><div class="brand">⚽ Pelada</div><div class="sub">${new Date(S.session.session_date+'T12:00:00').toLocaleDateString('pt-BR')}</div></div><div class="row"><button id="settingsBtn" class="btn ghost">⚙️</button><button id="out" class="btn ghost">Sair</button></div></header><main id="content"></main><nav class="nav"><div class="navin">${[['today','Hoje'],['players','Jogadores'],['queue','Fila'],['judge','Juiz'],['cash','Caixa'],['rank','Ranking'],['history','Histórico']].map(x=>`<button data-tab="${x[0]}">${x[1]}</button>`).join('')}</div></nav></div>`;
 $('#out').onclick=()=>sb.auth.signOut();$('#settingsBtn').onclick=settingsModal;$$('.nav button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});render();
}
function render(){
 try{
  $$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===S.tab));
  const view=({today,players,queue,judge,cash,rank,history}[S.tab]||today);
  view();
 }catch(err){
  console.error(err);
  const box=$('#content');
  if(box) box.innerHTML='<div class="card"><h3>Erro ao carregar esta tela</h3><p class="muted">'+esc(err?.message||String(err))+'</p><button class="btn primary" id="retryRender">Voltar para Hoje</button></div>';
  $('#retryRender')?.addEventListener('click',()=>{S.tab='today';render()});
 }
}
function settingsModal(){
 const s=S.settings||{};
 $('#modal').innerHTML=`<div class="modalBack"><div class="modal"><h3>⚙️ Configurações</h3><div class="stack"><div class="field"><label>Jogadores por time</label><input id="stTeam" type="number" value="${s.players_per_team||6}"></div><div class="field"><label>Duração (minutos)</label><input id="stMin" type="number" value="${Math.round((s.match_duration_seconds||420)/60)}"></div><div class="field"><label>Gols para encerrar</label><input id="stGoals" type="number" value="${s.goals_to_win||2}"></div><div class="field"><label>Contribuição padrão</label><input id="stFee" type="number" step="0.01" value="${s.default_fee||16}"></div><div class="field"><label>Custo padrão do campo</label><input id="stField" type="number" step="0.01" value="${s.default_field_cost||0}"></div><div class="field"><label>Times esperando para saída dos dois no empate</label><input id="stTie" type="number" value="${s.waiting_teams_for_double_exit||2}"></div><button id="saveSettings" class="btn primary">Salvar</button><button id="closeSettings" class="btn ghost">Cancelar</button></div></div></div>`;
 $('#closeSettings').onclick=()=>$('#modal').innerHTML='';
 $('#saveSettings').onclick=async()=>{
  const values={players_per_team:Number($('#stTeam').value||6),match_duration_seconds:Number($('#stMin').value||7)*60,goals_to_win:Number($('#stGoals').value||2),default_fee:Number($('#stFee').value||0),default_field_cost:Number($('#stField').value||0),waiting_teams_for_double_exit:Number($('#stTie').value||2),updated_at:new Date().toISOString()};
  const{data,error}=await sb.from('app_settings').update(values).eq('owner_id',S.user.id).select().single();if(error)return alert(error.message);S.settings=data;$('#modal').innerHTML='';render();
 };
}
function today(){
 let paid=S.payments.filter(x=>x.status==='paid').reduce((a,b)=>a+Number(b.amount),0),exp=S.cash.filter(x=>x.entry_type==='expense'&&x.session_id===S.session.id).reduce((a,b)=>a+Number(b.amount),0);
 $('#content').innerHTML=`<div class="grid g3"><div class="card"><div class="muted">Presentes</div><div class="big">${S.sp.filter(x=>x.status!=='left').length}</div></div><div class="card"><div class="muted">Partidas</div><div class="big">${S.matches.filter(x=>x.status==='finished').length}</div></div><div class="card"><div class="muted">Saldo do dia</div><div class="big">${fmt(paid-exp)}</div></div></div><div class="card" style="margin-top:12px"><h3>Pelada de hoje</h3><p class="muted">Começa zerada. Só entra o que for registrado.</p><div class="row"><button class="btn primary" id="p1">+ Jogador</button><button class="btn blue" id="p2">Fila</button><button class="btn" id="p3">Juiz</button><button class="btn amber" id="p4">🔥 Destaques</button></div></div>`;
 $('#p1').onclick=()=>{S.tab='players';render()};$('#p2').onclick=()=>{S.tab='queue';render()};$('#p3').onclick=()=>{S.tab='judge';render()};$('#p4').onclick=dailyHighlights;
}
async function dailyHighlights(){
 const finished=S.matches.filter(m=>m.status==='finished'),ids=finished.map(m=>m.id);if(!ids.length)return alert('Ainda não há partida encerrada hoje.');
 const [er,pr,mpr]=await Promise.all([
  sb.from('match_events').select('*').in('match_id',ids).eq('voided',false),
  sb.from('penalties').select('*').in('match_id',ids).eq('voided',false),
  sb.from('match_players').select('match_id,player_id,side').in('match_id',ids)
 ]);
 const names=Object.fromEntries(S.players.map(p=>[p.id,p.name])),stats={};
 const get=id=>stats[id]||(stats[id]={id,name:names[id]||'Jogador',goals:0,assists:0,saves:0,penGoals:0,penSaves:0,wins:0,points:0,rating:0});
 for(const e of (er.data||[])){if(e.event_type==='goal'){get(e.player_id).goals++;if(e.assist_player_id)get(e.assist_player_id).assists++}if(e.event_type==='save'&&e.goalkeeper_id)get(e.goalkeeper_id).saves++}
 for(const p of (pr.data||[])){if(p.result==='goal')get(p.shooter_id).penGoals++;if(p.result==='saved')get(p.goalkeeper_id).penSaves++}
 const byMatch={};for(const mp of (mpr.data||[]))(byMatch[mp.match_id]||(byMatch[mp.match_id]=[])).push(mp);
 for(const m of finished)if(m.winner_side)for(const mp of (byMatch[m.id]||[]))if(mp.side===m.winner_side)get(mp.player_id).wins++;
 const w=S.settings?.daily_rating_weights||{goal:2,assist:1.2,win:.6,save:.18,penalty_goal:.5,penalty_save:1};
 const arr=Object.values(stats);for(const x of arr){x.points=x.goals*Number(w.goal||2)+x.assists*Number(w.assist||1.2)+x.wins*Number(w.win||.6)+x.saves*Number(w.save||.18)+x.penGoals*Number(w.penalty_goal||.5)+x.penSaves*Number(w.penalty_save||1);x.rating=Math.min(10,Math.max(5,5+x.points));await sb.from('daily_ratings').upsert({session_id:S.session.id,player_id:x.id,rating:x.rating,data:x,updated_at:new Date().toISOString()},{onConflict:'session_id,player_id'})}
 arr.sort((a,b)=>b.rating-a.rating||b.goals-a.goals||b.assists-a.assists);
 const top=(key)=>[...arr].sort((a,b)=>b[key]-a[key])[0];
 $('#modal').innerHTML=`<div class="modalBack"><div class="modal"><div class="spread"><h3>🔥 Destaques do Dia</h3><button id="closeHighlights" class="btn ghost">Fechar</button></div><div class="grid g2"><div class="item">🏆 Craque<br><b>${arr[0]?.name||'-'}</b></div><div class="item">⚽ Artilheiro<br><b>${top('goals')?.name||'-'}</b></div><div class="item">🎯 Garçom<br><b>${top('assists')?.name||'-'}</b></div><div class="item">🧤 Melhor goleiro<br><b>${top('saves')?.name||'-'}</b></div></div><h4>Top 5</h4><div class="list">${arr.slice(0,5).map((x,i)=>`<div class="item spread"><b>${i+1}. ${esc(x.name)}</b><span class="pill">${x.rating.toFixed(1)}</span></div>`).join('')}</div></div></div>`;
 $('#closeHighlights').onclick=()=>$('#modal').innerHTML='';
}
function players(){
 let pm=Object.fromEntries(S.payments.map(x=>[x.player_id,x]));
 $('#content').innerHTML=`<div class="card spread"><div><h3>Jogadores de hoje</h3><div class="muted">Chegada, função e pagamento.</div></div><button id="add" class="btn primary">+ Adicionar</button></div><div class="list" style="margin-top:10px">${S.sp.length?S.sp.map(x=>`<div class="item spread"><div><b>${esc(x.players.name)}</b><div class="muted">${x.status} · ${x.fixed_goalkeeper_active?'🧤 Goleiro fixo hoje':x.players.is_fixed_goalkeeper?'🧤 Goleiro fixo (liberado para linha hoje)':x.players.can_play_goalkeeper?'Pode ir ao gol':'Somente linha'}</div></div><div class="row"><span class="pill">${pm[x.player_id]?.status==='paid'?fmt(pm[x.player_id].amount):pm[x.player_id]?.status||'pendente'}</span><button class="btn ghost" data-edit-player="${x.player_id}">Editar</button>${pm[x.player_id]?.status==='pending'?'<button class="btn primary" data-receive="'+x.player_id+'">Receber</button>':''}${x.status!=='left'?'<button class="btn red" data-left="'+x.id+'">Sair</button>':''}</div></div>`).join(''):'<div class="card empty">Nenhum jogador hoje.</div>'}</div>`;
 $('#add').onclick=addPlayer;
 $$('[data-edit-player]').forEach(b=>b.onclick=()=>editPlayerProfile(b.dataset.editPlayer));
 $$('[data-left]').forEach(b=>b.onclick=async()=>{const ok=await confirmAction('Jogador vai embora?','Ele sairá da pelada de hoje, mas continuará cadastrado para outras datas.','OK');if(!ok)return;await sb.from('session_players').update({status:'left',left_at:new Date().toISOString(),voluntarily_resting:false}).eq('id',b.dataset.left);refresh()});
 $$('[data-receive]').forEach(b=>b.onclick=()=>receivePayment(b.dataset.receive));
}
function editPlayerProfile(playerId){

function isFixedTodayRow(x){return !!x?.fixed_goalkeeper_active&&x?.status!=='left'}
function fixedTodayById(id,rows=S.sp){return !!rows.find(x=>x.player_id===id&&isFixedTodayRow(x))}
function pri(){return S.sp.filter(x=>x.status==='waiting').sort((a,b)=>b.waiting_seconds-a.waiting_seconds||a.play_seconds-b.play_seconds||b.consecutive_waits-a.consecutive_waits||new Date(a.arrived_at)-new Date(b.arrived_at))}
function transitionRole(playerId){
 if(!S.active||S.active.status!=='scheduled'||!S.prevMatch)return {label:fixedTodayById(playerId)?'🧤 Goleiro fixo':'Escalado',kind:fixedTodayById(playerId)?'fixed':'neutral'};
 const winnerIds=new Set(S.prevMp.filter(x=>x.side===S.prevMatch.winner_side&&!x.exited_at).map(x=>x.player_id));
 const loserIds=new Set(S.prevMp.filter(x=>x.side!==S.prevMatch.winner_side&&!x.exited_at).map(x=>x.player_id));
 if(fixedTodayById(playerId)&&S.prevMp.some(x=>x.player_id===playerId&&!x.exited_at))return {label:'🧤 Goleiro fixo permanece',kind:'fixed'};
 if(winnerIds.has(playerId))return {label:'🏆 Vencedor permanece',kind:'winner'};
 if(loserIds.has(playerId))return {label:'♻️ Reaproveitado do derrotado',kind:'reuse'};
 return {label:'⏳ Entrou pela fila',kind:'queue'};
}

async function replaceSuggested(playerId,mode='queue'){

   const loserFixed=protectedFixed.filter(x=>x.side===loserSide).map(x=>x.player_id),slots=n-loserFixed.length;
   const selected=takeWaiting(pool,slots,loserFixed.length>0),incoming=selected.map(x=>x.player_id);
   if(incoming.length<slots){
     const candidates=loserIds.filter(id=>!protectedIds.has(id)).map(id=>spOf(id)).filter(Boolean).filter(x=>x.status!=='left').sort((a,b)=>
       (Number(a.play_seconds||0)+(actualByPlayer[a.player_id]||0))-(Number(b.play_seconds||0)+(actualByPlayer[b.player_id]||0)) ||
       (Number(a.consecutive_plays||0)+1)-(Number(b.consecutive_plays||0)+1) ||
       Number(b.waiting_seconds||0)-Number(a.waiting_seconds||0) ||
       new Date(a.arrived_at)-new Date(b.arrived_at) ||
       String(a.players?.name||'').localeCompare(String(b.players?.name||''),'pt-BR')
     );
     for(const x of candidates){if(incoming.length>=slots)break;if(!incoming.includes(x.player_id))incoming.push(x.player_id)}
   }
   if(winnerIds.length===n&&incoming.length===slots){
     const opponent=[...loserFixed,...incoming],reusedIds=incoming.filter(id=>loserIds.includes(id));
     if(win==='left')await createNext(winnerIds,opponent,reusedIds);else await createNext(opponent,winnerIds,reusedIds);
   }
 }
 await refresh();S.tab='queue';render();
}
async function createNext(left,right,reusedIds=[]){
 const seq=Math.max(0,...S.matches.map(x=>x.sequence_no))+1,r=await sb.from('matches').insert({session_id:S.session.id,sequence_no:seq,status:'scheduled'}).select().single();
 if(r.error)return alert(r.error.message);const m=r.data,reused=new Set(reusedIds);
 await sb.from('match_players').insert([...left.map(id=>({match_id:m.id,player_id:id,side:'left',reused_from_loser:reused.has(id)})),...right.map(id=>({match_id:m.id,player_id:id,side:'right',reused_from_loser:reused.has(id)}))]);
 await sb.from('session_players').update({status:'playing'}).in('player_id',[...left,...right]).eq('session_id',S.session.id);
 const {data:rows}=await sb.from('session_players').select('*,players(*)').eq('session_id',S.session.id);
 for(const side of ['left','right']){
   const ids=side==='left'?left:right,team=(rows||[]).filter(x=>ids.includes(x.player_id));
   const g=team.find(x=>x.fixed_goalkeeper_active)||team.filter(x=>x.players.can_play_goalkeeper).sort((a,b)=>Number(a.goalkeeper_turns||0)-Number(b.goalkeeper_turns||0)||Number(a.goalkeeper_seconds||0)-Number(b.goalkeeper_seconds||0)||new Date(a.arrived_at)-new Date(b.arrived_at))[0];
   if(g){
     await sb.from('match_players').update({is_goalkeeper:true}).eq('match_id',m.id).eq('player_id',g.player_id);
     await sb.from('session_players').update({goalkeeper_turns:Number(g.goalkeeper_turns||0)+1}).eq('id',g.id);
   }
 }
}
async function judgeAccess(){let raw=crypto.getRandomValues(new Uint8Array(8)),token=[...raw].map(x=>x.toString(36)).join('').slice(0,12),buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(token)),hash=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');await sb.from('judge_sessions').insert({match_id:S.active.id,token_hash:hash,expires_at:new Date(Date.now()+10800000).toISOString()});let u=location.origin+location.pathname+'?judge='+token;await navigator.clipboard?.writeText(u);alert('Link do juiz copiado. Expira em 3 horas.')}
function cash(){let d=S.cash.filter(x=>x.session_id===S.session.id),inc=d.filter(x=>x.entry_type==='income').reduce((a,b)=>a+Number(b.amount),0),exp=d.filter(x=>x.entry_type==='expense').reduce((a,b)=>a+Number(b.amount),0),tot=S.cash.reduce((a,b)=>a+(b.entry_type==='income'?Number(b.amount):-Number(b.amount)),0);$('#content').innerHTML=`<div class="grid g3"><div class="card"><div class="muted">Entradas hoje</div><div class="big">${fmt(inc)}</div></div><div class="card"><div class="muted">Despesas hoje</div><div class="big">${fmt(exp)}</div></div><div class="card"><div class="muted">Caixa acumulado</div><div class="big">${fmt(tot)}</div></div></div><div class="card" style="margin-top:10px"><div class="spread"><h3>Movimentações</h3><button id="ex" class="btn primary">+ Despesa</button></div><div class="list">${d.map(x=>`<div class="item spread"><b>${esc(x.description)}</b><b>${x.entry_type==='expense'?'-':'+'}${fmt(x.amount)}</b></div>`).join('')||'<div class="empty">Sem movimentações.</div>'}</div></div>`;$('#ex').onclick=async()=>{let desc=prompt('Descrição','Campo'),val=Number(prompt('Valor','250')||0);if(desc&&val>0){await sb.from('cash_entries').insert({session_id:S.session.id,owner_id:S.user.id,entry_type:'expense',description:desc,amount:val});refresh()}}}
async function rank(){let{data}=await sb.from('player_career_stats').select('*').eq('owner_id',S.user.id);let a=(data||[]).sort((x,y)=>Number(y.goals)-Number(x.goals)||Number(y.assists)-Number(x.assists));$('#content').innerHTML=`<div class="card"><h3>Ranking consolidado</h3><p class="muted">A Nota do Dia fica separada.</p></div><div class="list" style="margin-top:10px">${a.map((x,i)=>`<div class="item spread"><div><b>${i+1}. ${esc(x.name)}</b><div class="muted">${x.matches} jogos · ${tsec(x.play_seconds)}</div></div><div>⚽ ${x.goals} · 🎯 ${x.assists} · 🧤 ${x.saves}</div></div>`).join('')||'<div class="card empty">Sem estatísticas ainda.</div>'}</div>`}
async function history(){let{data}=await sb.from('sessions').select('*').eq('owner_id',S.user.id).order('session_date',{ascending:false});$('#content').innerHTML=`<div class="card"><h3>Histórico</h3><p class="muted">Abra uma data para reconstruir a pelada.</p></div><div class="list" style="margin-top:10px">${(data||[]).map(x=>`<button class="item" style="text-align:left" data-history="${x.id}"><b>${new Date(x.session_date+'T12:00:00').toLocaleDateString('pt-BR')}</b><div class="muted">${x.status}</div></button>`).join('')||'<div class="card empty">Sem histórico.</div>'}</div>`;$$('[data-history]').forEach(b=>b.onclick=()=>historyDetail(b.dataset.history))}
async function historyDetail(sessionId){
 const [sr,sp,mt,ce,dr]=await Promise.all([sb.from('sessions').select('*').eq('id',sessionId).single(),sb.from('session_players').select('*,players(*)').eq('session_id',sessionId),sb.from('matches').select('*').eq('session_id',sessionId).order('sequence_no'),sb.from('cash_entries').select('*').eq('session_id',sessionId),sb.from('daily_ratings').select('*,players(name)').eq('session_id',sessionId).order('rating',{ascending:false})]);
 const income=(ce.data||[]).filter(x=>x.entry_type==='income').reduce((a,b)=>a+Number(b.amount),0),expense=(ce.data||[]).filter(x=>x.entry_type==='expense').reduce((a,b)=>a+Number(b.amount),0),ids=(mt.data||[]).map(x=>x.id);
 let events=[],pens=[];if(ids.length){const[e,p]=await Promise.all([sb.from('match_events').select('*').in('match_id',ids).eq('voided',false),sb.from('penalties').select('*').in('match_id',ids).eq('voided',false)]);events=e.data||[];pens=p.data||[]}
 $('#modal').innerHTML=`<div class="modalBack"><div class="modal"><div class="spread"><div><h3>Pelada de ${new Date(sr.data.session_date+'T12:00:00').toLocaleDateString('pt-BR')}</h3><div class="muted">${sp.data?.length||0} jogadores · ${mt.data?.filter(x=>x.status==='finished').length||0} partidas</div></div><button id="closeHist" class="btn ghost">Fechar</button></div><div class="grid g3" style="margin-top:10px"><div class="item"><div class="muted">Gols</div><div class="big">${events.filter(x=>x.event_type==='goal').length}</div></div><div class="item"><div class="muted">Pênaltis</div><div class="big">${pens.length}</div></div><div class="item"><div class="muted">Saldo</div><div class="big">${fmt(income-expense)}</div></div></div><h4>Partidas</h4><div class="list">${(mt.data||[]).map(m=>`<div class="item spread"><b>#${m.sequence_no} · ${m.left_score} × ${m.right_score}</b><span>${m.duration_seconds?tsec(m.duration_seconds):m.status}</span></div>`).join('')||'<div class="empty">Sem partidas.</div>'}</div>${dr.data?.length?`<h4>Notas do dia</h4><div class="list">${dr.data.slice(0,5).map(x=>`<div class="item spread"><b>${esc(x.players?.name||'')}</b><span class="pill">${Number(x.rating).toFixed(1)}</span></div>`).join('')}</div>`:''}</div></div>`;$('#closeHist').onclick=()=>$('#modal').innerHTML=''
}

async function bootJudge(token){
 const endpoint=URL+'/functions/v1/judge-action';
 async function get(){let r=await fetch(endpoint+'?token='+encodeURIComponent(token),{headers:{apikey:KEY}}),j=await r.json();if(!r.ok)throw new Error(j.error||'Acesso inválido');return j}
 async function call(action,payload={}){let r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({token,action,...payload})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Erro');return j}
 function elapsedJudge(m){let s=m.elapsed_before_pause_seconds||0;if(m.status==='live'&&m.started_at)s+=Math.max(0,Math.floor((Date.now()-new Date(m.started_at).getTime())/1000));return s}
 async function draw(){
  try{
   let s=await get(),m=s.match,duration=s.settings?.match_duration_seconds||420,remaining=Math.max(0,duration-elapsedJudge(m)),side=x=>s.players.filter(p=>p.side===x),pens=m.decided_by_penalties||((remaining<=0)&&m.left_score===m.right_score);
   document.body.innerHTML=`<div class="shell"><header class="top"><div><div class="brand">⚽ Modo Juiz</div><div class="sub">Somente partida atual</div></div></header><main><div class="score"><div class="clock">${tsec(remaining)}</div><div class="scoreline">${m.left_score} × ${m.right_score}</div><div class="teams">${['left','right'].map(sd=>`<div class="team"><h4 style="font-size:18px;${sd==='right'?'text-align:right':''}">${sd==='left'?'⬅️ TIME ESQUERDO':'TIME DIREITO ➡️'}</h4>${side(sd).map(p=>`<div class="player ${p.is_goalkeeper?'gk':''}">${p.is_goalkeeper?'🧤':'⚽'} ${esc(p.players?.name||'')}</div>`).join('')}<div class="gameBtns"><button class="btn primary" data-g="${sd}">⚽ Gol</button><button class="btn blue" data-sv="${sd}">🧤 Defesa</button></div>${pens?`<button class="btn amber" style="width:100%;margin-top:8px" data-pen="${sd}">🥅 Registrar pênalti</button>`:''}</div>`).join('')}</div><div class="judgeTools"><button id="jp" class="btn amber">${m.status==='scheduled'?'▶ Iniciar':m.status==='paused'?'▶ Retomar':'⏸ Pausar'}</button><button id="js" class="btn blue">🔁 Substituir</button><button id="jg" class="btn">🔄 Goleiro</button><button id="ju" class="btn undoBig">↩ DESFAZER</button></div>${remaining<=0?'<div class="pill" style="margin-top:10px">Tempo encerrado. O administrador confirma a transição.</div>':''}</div><div class="card" style="margin-top:10px"><h3>Eventos</h3>${s.events.filter(e=>!e.voided).slice().reverse().map(e=>`<div class="item">${e.event_type==='goal'?'⚽ Gol':e.event_type==='save'?'🧤 Defesa':e.metadata?.substitution?'🔁 Substituição':'🔄 Troca de goleiro'} · ${tsec(e.match_second||0)}</div>`).join('')||'<div class="empty">Sem eventos.</div>'}</div></main></div>`;
   $$('[data-g]').forEach(b=>b.onclick=()=>{let sd=b.dataset.g,ch=side(sd),n=Number(prompt('Quem marcou?\n'+ch.map((p,i)=>`${i+1}. ${p.players.name}`).join('\n')))-1;if(!ch[n])return;let rem=ch.filter((_,i)=>i!==n),a=prompt('Assistência: 0 = sem assistência\n'+rem.map((p,i)=>`${i+1}. ${p.players.name}`).join('\n')),ai=Number(a)-1;call('goal',{side:sd,scorer_id:ch[n].player_id,assist_id:a==='0'?null:rem[ai]?.player_id||null}).then(draw)});
   $$('[data-sv]').forEach(b=>b.onclick=()=>call('save',{side:b.dataset.sv}).then(draw));
   $$('[data-pen]').forEach(b=>b.onclick=async()=>{let sd=b.dataset.pen,ch=side(sd),n=Number(prompt('Cobrador:\n'+ch.map((p,i)=>`${i+1}. ${p.players.name}`).join('\n')))-1;if(!ch[n])return;let r=prompt('Resultado: G = gol, D = defesa, F = fora/trave','G')?.toUpperCase(),result=r==='D'?'saved':r==='F'?'missed':'goal';await call('penalty',{side:sd,shooter_id:ch[n].player_id,result});draw()});
   $('#jp').onclick=async()=>{
     const action=m.status==='scheduled'?'start':m.status==='paused'?'resume':'pause';
     const msg=action==='start'?'Iniciar o cronômetro desta partida?':action==='pause'?'Pausar o cronômetro agora?':'Retomar o cronômetro agora?';
     const ok=await confirmAction('Confirmar cronômetro?',msg,'OK');if(!ok)return;await call(action);draw();
   };
   $('#ju').onclick=async()=>{const ok=await confirmAction('Desfazer último evento?','O último gol, defesa, pênalti ou troca registrada será revertido.','OK');if(!ok)return;await call('undo');draw()};
   $('#js').onclick=async()=>{
     if(!['live','paused'].includes(m.status))return alert('A substituição só fica disponível com a partida iniciada ou pausada.');
     const waiting=s.waiting_players||[];if(!waiting.length)return alert('Não há ninguém disponível na fila para entrar.');
     const sd=await chooseSideAction('Qual time fará a substituição?',side('left'),side('right'),'Escolha visualmente o time.');
     if(!sd)return;
     const current=side(sd),outId=await choosePlayerAction('Quem vai sair?',current,'Esse jogador sairá da pelada de hoje após a substituição.');if(!outId)return;
     const inId=await choosePlayerAction('Quem entra da fila?',waiting,'Escolha o jogador que entrará agora.');if(!inId)return;
     const out=current.find(p=>p.player_id===outId),inn=waiting.find(p=>p.player_id===inId);if(!out||!inn)return;
     let newGkId=null;
     if(out.is_goalkeeper){
       const choices=[...current.filter(p=>p.player_id!==out.player_id),{player_id:inn.player_id,players:inn.players}].filter(p=>p.players?.can_play_goalkeeper);
       if(!choices.length)return alert('Não há outro jogador deste time habilitado para ir ao gol.');
       newGkId=await choosePlayerAction('Quem ficará no gol?',choices,'Apenas jogadores marcados como "pode ir ao gol" aparecem aqui.');if(!newGkId)return;
     }
     const ok=await confirmAction('Confirmar substituição?',`${out.players.name} sairá da pelada de hoje e ${inn.players.name} entrará agora.${out.is_goalkeeper?' O novo goleiro também será definido.':''}`,'OK');if(!ok)return;
     await call('substitution',{side:sd,out_player_id:out.player_id,in_player_id:inn.player_id,new_goalkeeper_id:newGkId});draw();
   };
   $('#jg').onclick=async()=>{
     const sd=await chooseSideAction('De qual time é o goleiro?',side('left'),side('right'),'Escolha visualmente o time onde haverá a troca.');
     if(!sd)return;
     const ch=side(sd),eligible=ch.filter(p=>p.players?.can_play_goalkeeper);
     if(!eligible.length)return alert('Nenhum jogador deste time está habilitado para ir ao gol.');
     const pid=await choosePlayerAction('Quem será o goleiro?',eligible,'Apenas jogadores marcados como "pode ir ao gol" aparecem aqui.');if(!pid)return;
     const oldGk=ch.find(p=>p.is_goalkeeper),next=eligible.find(p=>p.player_id===pid);if(!next||oldGk?.player_id===pid)return;
     const ok=await confirmAction('Confirmar troca de goleiro?',`${oldGk?.players?.name||'Goleiro atual'} sairá do gol e ${next.players.name} assumirá.`,'OK');if(!ok)return;
     await call('goalkeeper_change',{side:sd,new_goalkeeper_id:pid});draw();
   };
  }catch(e){document.body.innerHTML='<div class="login"><div class="card"><h2>Acesso do juiz</h2><p>'+esc(e.message)+'</p></div></div>'}
 }
 draw();setInterval(()=>{if(!document.getElementById('actionConfirmOverlay')&&!document.getElementById('playerChoiceOverlay')&&!document.getElementById('sideChoiceOverlay'))draw()},2000);
}
</script>
